<p-toast position="top-right" />

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">Menu</div>
    <nav class="side-nav">
      <a
        routerLink="/flows"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="side-link"
      >
        <i class="pi pi-list" aria-hidden="true"></i>
        <span>Flows</span>
      </a>
      <a
        routerLink="/flows/new"
        routerLinkActive="active"
        class="side-link side-link-create"
      >
        <i class="pi pi-plus-circle" aria-hidden="true"></i>
        <span>Create New Flow</span>
      </a>
    </nav>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-spacer" aria-hidden="true"></div>
      <a routerLink="/flows" class="logo-link" aria-label="Maicell home">
        <img src="/Maicell.png" alt="Maicell" class="logo" />
      </a>
      <div class="topbar-date" aria-live="polite">
        {{ now() | date: 'fullDate' }}
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
